apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: multi-app-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /mohamed
        pathType: Prefix
        backend:
          service:
            name: app1-svc
            port:
              number: 2000

      - path: /app2
        pathType: Prefix
        backend:
          service:
            name: app2-svc
            port:
              number: 2500

      - path: /tala
        pathType: Prefix
        backend:
          service:
            name: app3-service
            port:
              number: 9000
